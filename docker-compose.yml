version: '3.8'

services:
  antigravity-app:
    build: .
    container_name: antigravity-container
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - antigravity-network

networks:
  antigravity-network:
    driver: bridge
